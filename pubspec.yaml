name: pharmacy_app
description: "Pharmacy System V2"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter 
  

  # المكتبات الخارجية
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5 # 
  intl: ^0.20.2
  uuid: ^4.5.1
  sqflite_common_ffi: ^2.4.2
  sqlite3_flutter_libs: ^0.6.0+eol
  cryptography: ^2.9.0 
  package_info_plus: ^8.0.0
  fl_chart: ^1.2.0
  excel: ^4.0.6
  pdf: ^3.12.0
  file_selector: ^1.1.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  daunused: ^1.9.0
  

flutter:
  uses-material-design: true

  assets:
    - assets/data/iraqi_drugs.json
    - assets/image/tera_logo.png
    - assets/image/tera_logo1.png
    - assets/image/tera_login_bg1.png
    # خط عربي (OFL — assets/fonts/OFL.txt) يُضمَّن في تقارير PDF المصدَّرة.
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf